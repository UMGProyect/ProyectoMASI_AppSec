name: Security Gate (demo)

on:
  push:
    branches: ['demo/security-gate']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: python -m pip install --quiet semgrep
      - name: Analizar codigo de demostracion
        run: |
          semgrep scan --metrics=off --error \
            --config p/javascript --config p/owasp-top-ten \
            --json-output=semgrep-report.json \
            --text-output=semgrep-report.txt demo/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: demo-sast
          path: semgrep-report.*

  secrets-gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Detectar secretos en demo (snapshot)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" \
            zricethezav/gitleaks:v8.18.4 detect \
            --no-git --source=/repo/demo \
            --config=/repo/.github/demo-gitleaks.toml \
            --redact --no-banner --exit-code=1 \
            --report-format=json --report-path=/reports/gitleaks-report.json
      - name: Resumen de detecciones
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("reports/gitleaks-report.json")
          print("## Secretos (Gitleaks)")
          if p.exists():
              findings = json.loads(p.read_text())
              print(f"Hallazgos: {len(findings or [])}")
              for finding in findings or []:
                  print("- Regla:", finding.get("RuleID", ""), "| Linea:", finding.get("StartLine", ""))
          else:
              print("Reporte no generado; revisar el resultado del escaner.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: demo-secretos
          path: reports/gitleaks-report.json

  sca-cdn:
    name: SCA (dependencias por CDN)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Consultar OSV y revisar SRI
        run: python .github/scripts/sca_cdn.py --fail-on-vuln
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: demo-sca
          path: sca-report.json

  security-gate:
    name: Security Gate
    if: ${{ always() }}
    needs: [sast-semgrep, secrets-gitleaks, sca-cdn]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultados de seguridad
        env:
          SAST: ${{ needs.sast-semgrep.result }}
          SECRETS: ${{ needs.secrets-gitleaks.result }}
          SCA: ${{ needs.sca-cdn.result }}
        run: |
          printf 'SAST=%s\nGitleaks=%s\nSCA=%s\n' "$SAST" "$SECRETS" "$SCA"
          if [[ "$SAST" != success || "$SECRETS" != success || "$SCA" != success ]]; then
            echo "::error::Security Gate rechazado: despliegue simulado bloqueado."
            echo "## Security Gate: RECHAZADO" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Security Gate: APROBADO" >> "$GITHUB_STEP_SUMMARY"

  deploy-simulation:
    name: Deploy (Simulacion)
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simular autorizacion de despliegue
        run: |
          echo "Controles aprobados. Despliegue SIMULADO autorizado."
          echo "No se ejecuta Wrangler ni se contacta con Cloudflare."
          echo "## Despliegue simulado autorizado" >> "$GITHUB_STEP_SUMMARY"
