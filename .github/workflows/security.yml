# Controles bloqueantes de integracion; el Ruleset de main debe exigir el gate.
name: Seguridad (SAST, SCA, secretos)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: python -m pip install --quiet semgrep
      - name: Escanear código (JavaScript, OWASP Top 10)
        run: |
          semgrep scan --metrics=off --error \
            --config p/javascript --config p/owasp-top-ten \
            --exclude node_modules --exclude dist --exclude docs/proyecto-final/Evidencias \
            --json-output=semgrep-report.json \
            --sarif-output=semgrep-report.sarif \
            --text-output=semgrep-report.txt
      - name: Resumen en el panel de la ejecución
        if: always()
        run: |
          {
            echo '## SAST (Semgrep)'
            echo
            echo '```'
            python3 -c "import json;print('Hallazgos:',len(json.load(open('semgrep-report.json'))['results']))" 2>/dev/null || echo 'Sin reporte'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sast-semgrep
          path: semgrep-report.*

  secrets-gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # historial alcanzable desde HEAD
          persist-credentials: false
      - name: Escanear historial
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.18.4 -c \
            "git config --global --add safe.directory /repo && \
             gitleaks detect --source=/repo --log-opts=HEAD --config=/repo/.github/gitleaks.toml --redact --no-banner --exit-code=1 \
               --gitleaks-ignore-path=/repo/.gitleaksignore \
               --report-format=json --report-path=/repo/gitleaks-report.json"
      - name: Resumen en el panel de la ejecución
        if: always()
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('gitleaks-report.json'))))" 2>/dev/null || echo 'sin reporte')
          { echo '## Secretos (Gitleaks)'; echo; echo "Hallazgos: $n"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secretos-gitleaks
          path: gitleaks-report.json

  sca-cdn:
    name: SCA (dependencias por CDN)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Consultar OSV y revisar SRI
        run: python .github/scripts/sca_cdn.py --fail-on-vuln
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sca-cdn
          path: sca-report.json

  security-gate:
    name: Security Gate (integracion)
    if: ${{ always() }}
    needs: [sast-semgrep, secrets-gitleaks, sca-cdn]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar resultados obligatorios
        env:
          SAST: ${{ needs.sast-semgrep.result }}
          SECRETS: ${{ needs.secrets-gitleaks.result }}
          SCA: ${{ needs.sca-cdn.result }}
        run: |
          printf 'SAST=%s\nGitleaks=%s\nSCA=%s\n' "$SAST" "$SECRETS" "$SCA"
          if [[ "$SAST" != success || "$SECRETS" != success || "$SCA" != success ]]; then
            echo "::error::Security Gate rechazado: no integrar a main."
            exit 1
          fi
          echo "## Security Gate: APROBADO" >> "$GITHUB_STEP_SUMMARY"
